<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Control Federal — Sistema de Empleados</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<meta name="theme-color" content="#0a0c10">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Control Federal">
<link rel="apple-touch-icon" href="https://img.icons8.com/fluency/96/shield.png">
<style>
  :root{--bg:#0a0c10;--surface:#111318;--surface2:#1a1d25;--surface3:#22262f;--border:#2a2e3a;--accent:#3b82f6;--green:#22c55e;--yellow:#f59e0b;--red:#ef4444;--text:#e8eaf0;--text2:#8b90a0;--text3:#555a6a;--font:'Syne',sans-serif;--mono:'DM Mono',monospace;}
  *{margin:0;padding:0;box-sizing:border-box;}
  /* Tema claro */
  [data-theme="light"]{
    --bg:#f0f2f5;--surface:#ffffff;--surface2:#f5f7fa;--surface3:#e8ecf0;
    --border:#d0d5dd;--text:#1a1d25;--text2:#4a5568;--text3:#9aa3b0;
  }
  [data-theme="light"] #login-screen{background:radial-gradient(ellipse at 30% 40%,#dbeafe 0%,#f0f2f5 60%);}
  [data-theme="light"] .nav-tab{color:#4a5568;}
  [data-theme="light"] .nav-tab.active{color:var(--accent);}
  [data-theme="light"] .alerta-item{background:#fff5f5;border-color:#fecaca;}
  [data-theme="light"] .alerta-item.warning{background:#fffbeb;border-color:#fde68a;}
  body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh;}
  #login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 30% 40%,#1a1f3a 0%,var(--bg) 60%);}
  .login-box{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:48px 40px;width:100%;max-width:420px;box-shadow:0 0 60px rgba(59,130,246,.08);}
  .login-logo{text-align:center;margin-bottom:36px;}
  .login-logo h1{font-size:26px;font-weight:800;letter-spacing:-.5px;}
  .login-logo h1 span{color:var(--accent);}
  .login-logo p{color:var(--text2);font-size:13px;margin-top:4px;font-family:var(--mono);}
  .field{margin-bottom:18px;}
  .field label{display:block;font-size:12px;color:var(--text2);margin-bottom:6px;letter-spacing:.5px;text-transform:uppercase;font-family:var(--mono);}
  .field input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:12px 14px;color:var(--text);font-family:var(--font);font-size:14px;outline:none;transition:border-color .2s;}
  .field input:focus{border-color:var(--accent);}
  #login-error{color:var(--red);font-size:13px;text-align:center;margin-top:10px;display:none;}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;border-radius:8px;border:none;cursor:pointer;font-family:var(--font);font-size:14px;font-weight:600;transition:all .2s;}
  .btn-primary{background:var(--accent);color:#fff;}.btn-primary:hover{background:#2563eb;}
  .btn-secondary{background:var(--surface2);color:var(--text);border:1px solid var(--border);}.btn-secondary:hover{background:var(--surface3);}
  .btn-green{background:var(--green);color:#fff;}.btn-green:hover{background:#16a34a;}
  .btn-red{background:var(--red);color:#fff;}.btn-red:hover{background:#dc2626;}
  .btn-yellow{background:var(--yellow);color:#000;}.btn-yellow:hover{background:#d97706;}
  .btn-purple{background:#7c3aed;color:#fff;}.btn-purple:hover{background:#6d28d9;}
  .btn-sm{padding:7px 14px;font-size:13px;}.btn-xs{padding:5px 10px;font-size:12px;}
  .w-full{width:100%;}
  #app{display:none;flex-direction:column;min-height:100vh;}
  header{background:var(--surface);border-bottom:1px solid var(--border);padding:0 24px;height:60px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
  .header-left{display:flex;align-items:center;gap:16px;}
  .header-logo{font-size:18px;font-weight:800;letter-spacing:-.3px;}
  .header-logo span{color:var(--accent);}
  .role-badge{font-family:var(--mono);font-size:11px;padding:3px 10px;border-radius:20px;font-weight:500;text-transform:uppercase;letter-spacing:.5px;}
  .role-inicial{background:#1a2535;color:#60a5fa;border:1px solid #1e3a5f;}
  .role-medio{background:#1c2a1a;color:#4ade80;border:1px solid #1a3d1a;}
  .role-alto{background:#2a1f10;color:#fbbf24;border:1px solid #3d2a0a;}
  .role-federal{background:#1a1040;color:#a78bfa;border:1px solid #3d1f80;}
  .role-admin{background:#2a1020;color:#f472b6;border:1px solid #3d0a20;}
  .fiscal-badge{font-family:var(--mono);font-size:10px;padding:3px 10px;border-radius:20px;font-weight:600;text-transform:uppercase;letter-spacing:.3px;white-space:nowrap;}
  .fiscal-badge.ok{background:#0f2a1a;color:var(--green);border:1px solid #1a3d1a;}
  .fiscal-badge.bad{background:#2a0f10;color:var(--red);border:1px solid #3d1020;}
  .mini-input{background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:6px 8px;color:var(--text);font-family:var(--font);font-size:12px;outline:none;width:100px;}
  .mini-input:focus{border-color:var(--accent);}
  .gear-wrap{position:relative;}
  .gear-menu{display:none;position:absolute;top:calc(100% + 8px);right:0;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:6px;min-width:200px;box-shadow:0 8px 24px rgba(0,0,0,.35);z-index:50;flex-direction:column;gap:2px;}
  .gear-menu.open{display:flex;}
  .gear-menu button{background:transparent;border:none;color:var(--text);text-align:left;padding:9px 12px;border-radius:7px;font-size:13px;cursor:pointer;font-family:var(--font);}
  .gear-menu button:hover{background:var(--surface2);}
  .info-row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--border);font-size:13px;}
  .info-row:last-child{border-bottom:none;}
  .info-label{color:var(--text2);}
  .info-value{color:var(--text);font-weight:600;text-align:right;}
  .header-right{display:flex;align-items:center;gap:12px;}
  .user-name{font-size:14px;color:var(--text2);}
  .nav-tabs{display:flex;gap:4px;padding:0 24px;background:var(--surface);border-bottom:1px solid var(--border);overflow-x:auto;}
  .nav-tab{padding:10px 16px;font-size:13px;font-weight:600;cursor:pointer;border:none;background:none;color:var(--text2);border-bottom:2px solid transparent;transition:all .2s;white-space:nowrap;}
  .nav-tab:hover{color:var(--text);}.nav-tab.active{color:var(--accent);border-bottom-color:var(--accent);}
  .main{padding:28px 24px;flex:1;}
  .panel{display:none;}.panel.active{display:block;}
  .section-title{font-size:20px;font-weight:700;margin-bottom:20px;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:24px;margin-bottom:16px;}
  .card-title{font-size:13px;color:var(--text2);font-family:var(--mono);text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px;}
  .timer-display{font-family:var(--mono);font-size:56px;font-weight:500;text-align:center;padding:24px 0;color:var(--text);letter-spacing:4px;}
  .timer-display.running{color:var(--green);}.timer-display.paused{color:var(--yellow);}
  .timer-display.warning{color:var(--yellow);}.timer-display.limit{color:var(--red);animation:pulse 1s infinite;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
  .timer-controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px;}
  .code-input-row{display:flex;gap:10px;align-items:center;justify-content:center;margin-bottom:16px;}
  .code-input{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px 14px;color:var(--text);font-family:var(--mono);font-size:18px;letter-spacing:4px;text-align:center;width:160px;text-transform:uppercase;outline:none;transition:border-color .2s;}
  .code-input:focus{border-color:var(--accent);}
  .timer-status{text-align:center;font-size:13px;color:var(--text2);font-family:var(--mono);margin-top:8px;min-height:20px;}
  .total-box{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:16px 20px;text-align:center;margin-bottom:16px;}
  .total-label{font-size:11px;color:var(--text3);font-family:var(--mono);text-transform:uppercase;letter-spacing:.5px;}
  .total-value{font-family:var(--mono);font-size:30px;color:var(--accent);margin-top:4px;letter-spacing:2px;}
  .limit-banner{background:#2a0f10;border:1px solid var(--red);border-radius:10px;padding:16px;text-align:center;margin-bottom:16px;}
  .limit-banner p{color:var(--red);font-weight:700;font-size:15px;margin-bottom:4px;}
  .limit-banner span{color:var(--text2);font-size:13px;font-family:var(--mono);}
  .comunicado-item{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:12px;position:relative;}
  .comunicado-meta{font-family:var(--mono);font-size:11px;color:var(--text3);margin-bottom:6px;}
  .comunicado-from{color:var(--accent);font-weight:500;}
  .comunicado-text{font-size:14px;line-height:1.6;padding-right:28px;}
  .del-btn{position:absolute;top:10px;right:10px;background:none;border:none;color:var(--text3);cursor:pointer;font-size:15px;padding:4px 6px;border-radius:4px;transition:all .2s;}
  .del-btn:hover{color:var(--red);background:rgba(239,68,68,.1);}
  .alerta-item{background:#1f1015;border:1px solid #3d1020;border-radius:10px;padding:16px;margin-bottom:12px;position:relative;}
  .alerta-item.warning{background:#1f1a0a;border-color:#3d2a0a;}
  .alerta-meta{font-family:var(--mono);font-size:11px;color:var(--text3);margin-bottom:6px;}
  .alerta-text{font-size:14px;color:var(--text);padding-right:28px;}
  .alerta-min{font-family:var(--mono);font-size:12px;color:var(--red);margin-top:6px;}
  .grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
  .grid-5{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;}
  .stat-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px;}
  .stat-number{font-size:32px;font-weight:700;margin-bottom:4px;}
  .stat-label{font-size:12px;color:var(--text2);font-family:var(--mono);text-transform:uppercase;}
  .table{width:100%;border-collapse:collapse;}
  .table th{text-align:left;padding:10px 12px;font-size:11px;color:var(--text3);font-family:var(--mono);text-transform:uppercase;border-bottom:1px solid var(--border);}
  .table td{padding:10px 12px;font-size:13px;border-bottom:1px solid var(--border);vertical-align:middle;}
  .table tr:last-child td{border-bottom:none;}.table tr:hover td{background:var(--surface2);}
  .online-dot{width:8px;height:8px;border-radius:50%;background:var(--green);display:inline-block;margin-right:6px;box-shadow:0 0 6px var(--green);}
  .offline-dot{width:8px;height:8px;border-radius:50%;background:var(--text3);display:inline-block;margin-right:6px;}
  .gen-code{font-family:var(--mono);font-size:36px;letter-spacing:8px;text-align:center;color:var(--accent);padding:24px;background:var(--surface2);border-radius:10px;border:1px solid var(--border);margin:16px 0;}
  .gen-code.alert-code{color:#a78bfa;}
  .code-cd{text-align:center;font-family:var(--mono);font-size:13px;color:var(--text2);}
  .code-cd span{color:var(--yellow);font-weight:500;}
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:1000;display:none;align-items:center;justify-content:center;}
  .modal-overlay.open{display:flex;}
  .modal{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:32px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto;}
  .modal-title{font-size:18px;font-weight:700;margin-bottom:24px;}
  .form-row{margin-bottom:16px;}
  .form-row label{display:block;font-size:12px;color:var(--text2);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px;font-family:var(--mono);}
  .form-row input,.form-row select,.form-row textarea{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px 14px;color:var(--text);font-family:var(--font);font-size:14px;outline:none;transition:border-color .2s;}
  .form-row select option{background:var(--surface2);}
  .form-row input:focus,.form-row select:focus,.form-row textarea:focus{border-color:var(--accent);}
  .form-row textarea{resize:vertical;min-height:80px;}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:24px;}
  .hist-item{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--border);}
  .hist-time{font-family:var(--mono);font-size:11px;color:var(--text3);min-width:90px;flex-shrink:0;}
  .hist-text{font-size:13px;color:var(--text2);flex:1;}
  .hist-user{color:var(--text);font-weight:600;}
  .empty{text-align:center;padding:40px;color:var(--text3);font-size:14px;}
  .tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-family:var(--mono);}
  .tag-green{background:#0f2a1a;color:var(--green);}.tag-red{background:#2a0f10;color:var(--red);}.tag-yellow{background:#2a1f0a;color:var(--yellow);}.tag-purple{background:#1e1040;color:#a78bfa;}
  .flex{display:flex;}.items-center{align-items:center;}.gap-2{gap:8px;}.justify-between{justify-content:space-between;}
  .mb-4{margin-bottom:16px;}
  .scroll-area{max-height:440px;overflow-y:auto;}
  .scroll-area::-webkit-scrollbar{width:4px;}
  .scroll-area::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}
  #toast{position:fixed;bottom:24px;right:24px;z-index:9999;background:var(--surface3);border:1px solid var(--border);border-radius:10px;padding:14px 20px;font-size:14px;display:none;max-width:340px;box-shadow:0 8px 24px rgba(0,0,0,.4);}
  .warn-box{background:#1a0f10;border:1px solid #3d1020;border-radius:10px;padding:16px;margin-bottom:16px;font-size:13px;color:var(--text2);}
  .warn-box strong{color:var(--red);}
  .cleanup-bar{display:flex;align-items:center;justify-content:space-between;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px 16px;margin-bottom:16px;flex-wrap:wrap;gap:8px;}
  .cleanup-info{font-size:12px;color:var(--text3);font-family:var(--mono);}
  @media(max-width:600px){.grid-3,.grid-5{grid-template-columns:1fr 1fr;}header{padding:0 16px;}.main{padding:20px 16px;}.timer-display{font-size:40px;}}
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">
      <h1>CONTROL <span>FEDERAL</span></h1>
      <p>Sistema de Control de Empleados</p>
    </div>
    <div class="field"><label>Correo electrónico</label><input type="email" id="login-email" placeholder="usuario@agenciafederal.com"></div>
    <div class="field"><label>Contraseña</label><input type="password" id="login-pass" placeholder="••••••••"></div>
    <button class="btn btn-primary w-full" onclick="doLogin()">Iniciar sesión</button>
    <div id="login-error">Correo o contraseña incorrectos.</div>
  </div>
</div>

<div id="app">
  <header>
    <div class="header-left">
      <span class="header-logo">CONTROL <span>FEDERAL</span></span>
      <span id="role-badge" class="role-badge"></span>
    </div>
    <div class="header-right">
      <span class="user-name" id="header-username"></span>
      <span id="fiscal-badge" class="fiscal-badge"></span>
      <button class="btn btn-secondary btn-sm" id="theme-btn" onclick="toggleTheme()" title="Cambiar tema">🌙</button>
      <div class="gear-wrap">
        <button class="btn btn-secondary btn-sm" onclick="toggleGearMenu()" title="Configuración">⚙️</button>
        <div class="gear-menu" id="gear-menu">
          <button onclick="abrirInfoGeneral()">ℹ️ Información General</button>
          <button onclick="abrirCambiarPass()">🔑 Cambiar contraseña</button>
          <button onclick="doLogout()">🚪 Salir</button>
        </div>
      </div>
    </div>
  </header>
  <div class="nav-tabs" id="nav-tabs"></div>
  <div class="main" id="main-content"></div>
</div>

<div class="modal-overlay" id="modal-cambiar-pass">
  <div class="modal">
    <div class="modal-title">Cambiar contraseña</div>
    <div class="form-row"><label>Contraseña actual</label><input type="password" id="cp-actual" placeholder="••••••••"></div>
    <div class="form-row"><label>Nueva contraseña</label><input type="password" id="cp-nueva" placeholder="Mínimo 6 caracteres"></div>
    <div class="form-row"><label>Confirmar nueva contraseña</label><input type="password" id="cp-confirmar" placeholder="Repite la nueva contraseña"></div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal('modal-cambiar-pass')">Cancelar</button>
      <button class="btn btn-primary" onclick="guardarCambioPass()">Guardar</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-info-general">
  <div class="modal">
    <div class="modal-title">Información General</div>
    <div id="info-general-body"></div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal('modal-info-general')">Cerrar</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-editar-info-admin">
  <div class="modal">
    <div class="modal-title">Editar información de empleado</div>
    <input type="hidden" id="ei-uid">
    <div class="form-row"><label>Rango</label><input type="text" id="ei-rango" placeholder="Ej: Comandante"></div>
    <div class="form-row"><label>Número (Rango Numérico)</label><input type="text" id="ei-numero" placeholder="Ej: 0452"></div>
    <div class="form-row"><label>Jefe Directo</label><input type="text" id="ei-jefe" placeholder="Nombre del jefe directo"></div>
    <div class="form-row"><label>Correo Institucional</label><input type="email" id="ei-correo" placeholder="correo@institucion.gob"></div>
    <div class="form-row"><label>Rama Laboral</label><input type="text" id="ei-rama" placeholder="Ej: Investigación"></div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal('modal-editar-info-admin')">Cancelar</button>
      <button class="btn btn-primary" onclick="guardarInfoAdmin()">Guardar</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-crear-usuario">
  <div class="modal">
    <div class="modal-title">Crear nuevo usuario</div>
    <div class="form-row"><label>Nombre</label><input type="text" id="nu-name" placeholder="Ej: empleado01"></div>
    <div class="form-row"><label>Correo</label><input type="email" id="nu-email" placeholder="correo@agenciafederal.com"></div>
    <div class="form-row"><label>Contraseña</label><input type="password" id="nu-pass" placeholder="Mínimo 6 caracteres"></div>
    <div class="form-row"><label>Rol</label>
      <select id="nu-role">
        <option value="inicial">Inicial</option>
        <option value="medio">Medio</option>
        <option value="alto">Alto</option>
        <option value="federal">Federal</option>
        <option value="admin">Admin</option>
      </select>
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal('modal-crear-usuario')">Cancelar</button>
      <button class="btn btn-primary" onclick="crearUsuario()">Crear usuario</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged, EmailAuthProvider, reauthenticateWithCredential, updatePassword }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getDatabase, ref, set, get, push, onValue, update, remove, query, limitToLast, onDisconnect as fbOnDisconnect }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAvWsM93jySB3j_7n2IgRN5kjTPNDPyLKc",
  authDomain: "gestoradminfederal.firebaseapp.com",
  databaseURL: "https://gestoradminfederal-default-rtdb.firebaseio.com",
  projectId: "gestoradminfederal",
  storageBucket: "gestoradminfederal.firebasestorage.app",
  messagingSenderId: "641942964724",
  appId: "1:641942964724:web:7adf8ca0bde3a1573151a1"
};

const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db   = getDatabase(app);

// ── ROLES ──────────────────────────────────────────────────
// Jerarquía: inicial < medio < alto < federal < admin
// Roles con cronómetro libre (sin límite de 60 min)
const ROLES_LIBRES    = new Set(['alto','federal','admin']);
// Roles con límite de 60 min
const ROLES_LIMITADOS = new Set(['inicial','medio']);
// Roles que pueden generar códigos
const ROLES_CODIGOS   = new Set(['alto','federal','admin']);
// Roles que pueden ver/usar Control
const ROLES_CONTROL   = new Set(['federal','admin']);
// Roles que pueden enviar alertas sin código externo
const ROLES_ALERTA_LIBRE = new Set(['federal','admin']);
// Tipos de log que NUNCA se borran
const TIPOS_PERM = new Set(['sesion','crear_usuario','alerta','comunicado','reset_tiempo','restar_minutos','cambio_rol','liberar_timer','cambio_fiscal','cambio_datos','cambio_codigos_estado']);
const ROLE_LABELS = {inicial:'Cargos Iniciales',medio:'Cargos Medios',alto:'Cargos Altos',federal:'Cargos Federales',admin:'Administrador'};
const WEEK_MS = 7*24*60*60*1000;

let displayInterval=null, controlRefreshInterval=null;
let allUsers={};
let codeExpTimer=null, alertCodeExpTimer=null;

window.showToast=(msg,color='#3b82f6')=>{
  const t=document.getElementById('toast');
  t.textContent=msg;t.style.borderColor=color;t.style.display='block';
  setTimeout(()=>t.style.display='none',4000);
};
window.openModal =id=>document.getElementById(id).classList.add('open');
window.closeModal=id=>document.getElementById(id).classList.remove('open');

window.toggleGearMenu=()=>{
  document.getElementById('gear-menu').classList.toggle('open');
};
document.addEventListener('click',e=>{
  const wrap=document.querySelector('.gear-wrap');

window.abrirCambiarPass=()=>{
  document.getElementById('gear-menu').classList.remove('open');
  document.getElementById('cp-actual').value='';
  document.getElementById('cp-nueva').value='';
  document.getElementById('cp-confirmar').value='';
  openModal('modal-cambiar-pass');
};
window.guardarCambioPass=async()=>{
  const actual=document.getElementById('cp-actual').value;
  const nueva=document.getElementById('cp-nueva').value;
  const confirmar=document.getElementById('cp-confirmar').value;
  if(!actual||!nueva){showToast('Completa ambos campos','#ef4444');return;}
  if(nueva.length<6){showToast('La nueva contraseña debe tener mínimo 6 caracteres','#ef4444');return;}
  if(nueva!==confirmar){showToast('Las contraseñas nuevas no coinciden','#ef4444');return;}
  try{
    const cred=EmailAuthProvider.credential(auth.currentUser.email,actual);
    await reauthenticateWithCredential(auth.currentUser,cred);
    await updatePassword(auth.currentUser,nueva);
    showToast('Contraseña actualizada ✓','#22c55e');
    closeModal('modal-cambiar-pass');
  }catch(err){
    showToast(err.code==='auth/invalid-credential'||err.code==='auth/wrong-password'?'Contraseña actual incorrecta':'Error al cambiar la contraseña','#ef4444');
  }
};

window.abrirInfoGeneral=async()=>{

  const u=snap.val()||{};
  const alSnap=await get(ref(db,`alertas/${CU.uid}`));

  const sinConfirmar=alertas.filter(a=>!a.confirmado);

  const totalAlertas=alertas.length;

    <div class="info-row"><span class="info-label">Jefe Directo</span><span class="info-value">${u.jefeDirecto||'—'}</span></div>

    <div class="info-row"><span class="info-label">Rango Numérico</span><span class="info-value">${u.numero||'—'}</span></div>
    <div class="info-row"><span class="info-label">Alertas No Confirmadas</span><span class="info-value" style="color:${sinConfirmar.length?'var(--red)':'var(--green)'}">${sinConfirmar.length?sinConfirmar.length+' pendiente(s)':'Sin pendientes'}</span></div>
    <div class="info-row"><span class="info-label">Correo Institucional</span><span class="info-value">${u.correoInstitucional||u.email||'—'}</span></div>
    <div class="info-row"><span class="info-label">Rama Laboral</span><span class="info-value">${u.ramaLaboral||'—'}</span></div>

function calcElapsed(ts){
  if(!ts)return 0;
  if(ts.running&&ts.startedAt>0) return Math.floor((Date.now()-ts.startedAt)/1000);
  return ts.pausedElapsed||0;
}
const fmt  = s=>`${Math.floor(s/60).toString().padStart(2,'0')}:${(s%60).toString().padStart(2,'0')}`;
const fmtH = s=>{const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sec=s%60;return`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;};
const tsStr= ts=>{if(!ts)return'';const d=new Date(ts);return d.toLocaleDateString('es-MX')+' '+d.toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'});};
const rndCode=()=>{const c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';return Array.from({length:6},()=>c[Math.floor(Math.random()*c.length)]).join('');};
const older7=ts=>ts&&(Date.now()-ts)>WEEK_MS;
const isTrivialLog=tipo=>!TIPOS_PERM.has(tipo);

window.doLogin=async()=>{
  const email=document.getElementById('login-email').value.trim();
  const pass =document.getElementById('login-pass').value;
  document.getElementById('login-error').style.display='none';
  try{await signInWithEmailAndPassword(auth,email,pass);}
  catch{const e=document.getElementById('login-error');e.style.display='block';e.textContent='Correo o contraseña incorrectos.';}
};

window.doLogout=async()=>{
  clearInterval(displayInterval);clearInterval(controlRefreshInterval);
  if(CU) await update(ref(db,`users/${CU.uid}`),{online:false,lastSeen:Date.now()});
  await signOut(auth);
};

onAuthStateChanged(auth,async user=>{
  if(user){
    CU=user;
    const snap=await get(ref(db,`users/${user.uid}`));
    if(!snap.exists()){
      await set(ref(db,`users/${user.uid}`),{name:'divercrock',role:'admin',email:user.email,online:true,lastSeen:Date.now(),createdAt:Date.now(),totalSeconds:0,timerRunning:false,timerPaused:false,timerStartedAt:0,timerPausedElapsed:0,timerLimitReached:false,tributario:true,rango:'',numero:''});
    } else {
      await update(ref(db,`users/${user.uid}`),{online:true,lastSeen:Date.now()});
    }
    const ud=(await get(ref(db,`users/${user.uid}`))).val();
    CR=ud.role; CN=ud.name;
    // onDisconnect: marcar offline automáticamente si se cierra el navegador
    const userRef=ref(db,`users/${user.uid}`);
    fbOnDisconnect(userRef).update({online:false,lastSeen:Date.now(),timerRunning:false,timerPaused:false});
    initApp(ud);
  } else {
    CU=null;CR=null;CN=null;
    document.getElementById('login-screen').style.display='flex';
    document.getElementById('app').style.display='none';
    clearInterval(displayInterval);clearInterval(controlRefreshInterval);
  }
});

function initApp(ud){
  document.getElementById('login-screen').style.display='none';
  document.getElementById('app').style.display='flex';
  document.getElementById('header-username').textContent=ud.name;
  const b=document.getElementById('role-badge');
  b.textContent=ROLE_LABELS[ud.role]||ud.role.toUpperCase();b.className=`role-badge role-${ud.role}`;
  updateFiscalBadge(ud.tributario);
  fetch('https://api.ipify.org?format=json').then(r=>r.json()).then(d=>{
    if(d&&d.ip)update(ref(db,`users/${CU.uid}`),{lastIp:d.ip,lastIpAt:Date.now()});
  }).catch(()=>{});
  onValue(ref(db,`users/${CU.uid}`),s=>{const u=s.val();if(u)updateFiscalBadge(u.tributario);});
  onValue(ref(db,'users'),s=>{allUsers=s.val()||{};});
  initCodeOwnerCache();
  buildNav(ud.role);
  listenRemoteCommands();
}

function updateFiscalBadge(tributario){
  const fb=document.getElementById('fiscal-badge');if(!fb)return;
  const ok=tributario!==false;
  fb.textContent=ok?'Cumplimiento Tributario':'Crédito Fiscal';
  fb.className=`fiscal-badge ${ok?'ok':'bad'}`;
}

function buildNav(role){
  const tabs=document.getElementById('nav-tabs'),main=document.getElementById('main-content');
  tabs.innerHTML='';main.innerHTML='';

  // Pestañas disponibles por rol
  const pages=[];
  pages.push({id:'cronometro',label:'⏱ Cronómetro'});
  pages.push({id:'comunicados',label:'📋 Comunicados'});
  pages.push({id:'alertas',label:'🚨 Mis Alertas'});
  if(ROLES_CODIGOS.has(role))       pages.push({id:'codigos',label:'🔑 Códigos'});
  if(role==='alto')                  pages.push({id:'alerta-alto',label:'⚠️ Enviar Alerta'});
  if(role==='alto')                  pages.push({id:'control-alto',label:'🎮 Control'});
  if(ROLES_ALERTA_LIBRE.has(role))  pages.push({id:'enviar-alerta-libre',label:'⚠️ Alertas'});
  if(ROLES_CONTROL.has(role))       pages.push({id:'control',label:'🎮 Control'});
  if(ROLES_CONTROL.has(role))       pages.push({id:'gestion-codigos',label:'🔒 Gestión de Códigos'});
  if(ROLES_CONTROL.has(role))       pages.push({id:'dashboard',label:'📊 Dashboard'});
  if(role==='admin')                 pages.push({id:'tiempos',label:'⏱ Tiempos'});
  if(role==='admin')                 pages.push({id:'rendimiento',label:'📈 Rendimiento'});
  if(role==='admin')                 pages.push({id:'usuarios',label:'👥 Usuarios'});
  if(role==='admin')                 pages.push({id:'fiscal',label:'🧾 Estatus Fiscal'});
  if(ROLES_CONTROL.has(role))       pages.push({id:'historial',label:'📜 Historial'});
  if(ROLES_CONTROL.has(role))       pages.push({id:'enviar-com',label:'📢 Comunicados'});

  pages.forEach((p,i)=>{
    const btn=document.createElement('button');
    btn.className='nav-tab'+(i===0?' active':'');btn.textContent=p.label;
    btn.onclick=()=>{
      document.querySelectorAll('.nav-tab').forEach(b=>b.classList.remove('active'));btn.classList.add('active');
      document.querySelectorAll('.panel').forEach(p2=>p2.classList.remove('active'));
      document.getElementById('panel-'+p.id)?.classList.add('active');
    };
    tabs.appendChild(btn);
    const panel=document.createElement('div');
    panel.id='panel-'+p.id;panel.className='panel'+(i===0?' active':'');
    main.appendChild(panel);
  });

  buildCronometro(role);
  buildComunicados(role);
  buildMisAlertas();
  if(ROLES_CODIGOS.has(role))      buildCodigos(role);
  if(role==='alto')                 buildAlertaAlto();
  if(role==='alto')                 buildControlAlto();
  if(ROLES_ALERTA_LIBRE.has(role)) buildEnviarAlertaLibre(role);
  if(ROLES_CONTROL.has(role))      buildControl(role);
  if(ROLES_CONTROL.has(role))      buildGestionCodigos(role);
  if(ROLES_CONTROL.has(role))      buildDashboard();
  if(role==='admin')                buildTiempos();
  if(role==='admin')                buildRendimientoAltos();
  if(role==='admin')                buildUsuarios();
  if(role==='admin')                buildFiscal();
  if(ROLES_CONTROL.has(role))      buildHistorial();
  if(ROLES_CONTROL.has(role))      buildEnviarCom(role);

  if(role==='admin') setTimeout(buildUsuariosConKeys,500);
}

  const libre=ROLES_LIBRES.has(role);
  const solopausa=ROLES_LIMITADOS.has(role);
  el.innerHTML=`
    <div class="section-title">Mi Cronómetro</div>
    <div class="total-box">
      <div class="total-label">Tiempo total acumulado</div>
      <div class="total-value" id="total-disp">00:00:00</div>
    </div>
    <div class="card">
      ${!libre?`
        <div class="card-title">Código de activación · 1 solo uso</div>
        <div class="code-input-row">
          <input class="code-input" id="code-in" maxlength="6" placeholder="XXXXXX" oninput="this.value=this.value.toUpperCase()">
          <button class="btn btn-primary" id="btn-activar" onclick="activarCodigo()">Activar</button>
        </div>
      `:`<div class="card-title">Cronómetro libre · ${role}</div>`}
      <div id="limit-banner" style="display:none" class="limit-banner">
        <p>⏰ Límite de 1 hora alcanzado</p>
        <span id="limit-msg">Un Timer debe liberar tu cronómetro</span>
      </div>
      <div id="timer-asignado-box" style="display:none;text-align:center;margin-bottom:12px;font-family:var(--mono);font-size:13px;color:var(--text2)">
        Tu Timer asignado: <strong id="timer-asignado-name" style="color:var(--accent)">—</strong>
      </div>
      <div class="timer-display" id="timer-disp">00:00</div>
      <div class="timer-status" id="timer-stat">${libre?'Listo para iniciar':'Ingresa un código para activar'}</div>
      <div class="timer-controls">
        ${libre?`<button class="btn btn-green" id="btn-start" onclick="startTimer()">▶ Iniciar</button>`:''}
        <button class="btn btn-yellow" id="btn-pause" style="display:none" onclick="pauseTimer()">⏸ Pausar</button>
        <button class="btn btn-secondary" id="btn-resume" style="display:none" onclick="resumeTimer()">▶ Reanudar</button>
        ${!solopausa?`<button class="btn btn-secondary" id="btn-stop" style="display:none" onclick="stopTimer()">⏹ Detener</button>`:''}
      </div>
    </div>

function listenMyTimer(solopausa){
  if(!CU)return;
  onValue(ref(db,`users/${CU.uid}`),snap=>{
    const ud=snap.val();if(!ud)return;
    TS={running:ud.timerRunning||false,paused:ud.timerPaused||false,startedAt:ud.timerStartedAt||0,pausedElapsed:ud.timerPausedElapsed||0,activeCodeKey:ud.activeCodeKey||null,limitReached:ud.timerLimitReached||false};
    _updateUI(solopausa);
  });
}

function _updateUI(solopausa){
  _btns(solopausa);
  const banner=document.getElementById('limit-banner');
  const asigBox=document.getElementById('timer-asignado-box');
  const limitMsg=document.getElementById('limit-msg');
  if(banner) banner.style.display=TS.limitReached?'block':'none';
  // Mensaje dinámico según rol
  if(limitMsg){
    if(ROLES_LIBRES.has(CR)) limitMsg.textContent='Verifica y libera tu cronómetro';
    else if(CR==='alto') limitMsg.textContent='Un Admin o Cargo Federal debe liberar tu cronómetro';
    else limitMsg.textContent='Un Timer debe liberar tu cronómetro';
  }
  // Mostrar quién asignó el código (solo para inicial/medio, siempre que haya código activo)
  if(asigBox){
    if(ROLES_LIMITADOS.has(CR)&&TS.activeCodeKey){
      const ownerName=_codeOwnerCache[TS.activeCodeKey]||'cargando...';
      // Si no está en cache, buscarlo en Firebase
      if(ownerName==='cargando...'){
        get(ref(db,`codigos/timer/${TS.activeCodeKey}`)).then(s=>{
          if(s.exists()){
            const n=s.val().createdByName||'—';
            _codeOwnerCache[TS.activeCodeKey]=n;
            const nameEl=document.getElementById('timer-asignado-name');
            if(nameEl) nameEl.textContent=n;
          }
        });
      }
      const nameEl=document.getElementById('timer-asignado-name');
      if(nameEl) nameEl.textContent=ownerName;
      asigBox.style.display='block';
    } else {
      asigBox.style.display='none';
    }
  }
  if(TS.running&&!TS.limitReached){ _startLoop(solopausa); }
  else {
    clearInterval(displayInterval);
    const elapsed=calcElapsed(TS);
    const d=document.getElementById('timer-disp');const s=document.getElementById('timer-stat');
    if(d){d.textContent=TS.limitReached?'01:00:00':fmt(elapsed);d.className=TS.limitReached?'timer-display limit':TS.paused?'timer-display paused':'timer-display';}
    if(s&&!TS.limitReached){if(TS.paused)s.textContent='⏸ En pausa';else if(elapsed===0)s.textContent=ROLES_LIBRES.has(CR)?'Listo para iniciar':'Ingresa un código para activar';}
    if(s&&TS.limitReached)s.textContent='';
  }
}

function _startLoop(solopausa){
  clearInterval(displayInterval);
  displayInterval=setInterval(async()=>{
    const elapsed=calcElapsed(TS);
    const d=document.getElementById('timer-disp');const s=document.getElementById('timer-stat');
    if(ROLES_LIMITADOS.has(CR)&&elapsed>=3600){
      clearInterval(displayInterval);
      if(d){d.textContent='01:00:00';d.className='timer-display limit';}
      if(s)s.textContent='';
      const banner=document.getElementById('limit-banner');if(banner)banner.style.display='block';
      await update(ref(db,`users/${CU.uid}`),{timerRunning:false,timerLimitReached:true,timerStartedAt:0,timerPausedElapsed:3600});
      showToast('Límite de 1 hora. Un admin o cargo federal liberará tu cronómetro.','#ef4444');
      return;
    }
    if(d){d.textContent=fmt(elapsed);d.className=ROLES_LIMITADOS.has(CR)&&elapsed>=3300?'timer-display warning':'timer-display running';}
    if(s)s.textContent=`▶ En curso ${fmt(elapsed)}`;
  },1000);
}

function _btns(solopausa){
  const libre=ROLES_LIBRES.has(CR);
  const bs=document.getElementById('btn-start'),bp=document.getElementById('btn-pause');
  const br=document.getElementById('btn-resume'),bst=document.getElementById('btn-stop');
  const ba=document.getElementById('btn-activar');
  if(TS.limitReached){[bs,bp,br,bst,ba].forEach(b=>b&&(b.style.display='none'));return;}
  if(TS.running){
    if(bs)bs.style.display='none';if(bp)bp.style.display='inline-flex';
    if(br)br.style.display='none';if(bst&&!solopausa)bst.style.display='inline-flex';
    if(ba)ba.style.display='none';
  } else if(TS.paused){
    if(bs)bs.style.display='none';if(bp)bp.style.display='none';
    if(br)br.style.display='inline-flex';if(bst&&!solopausa)bst.style.display='inline-flex';
    if(ba)ba.style.display='none';
  } else {
    if(libre&&bs)bs.style.display='inline-flex';if(bp)bp.style.display='none';
    if(br)br.style.display='none';if(bst)bst&&(bst.style.display='none');
    if(ba)ba.style.display='inline-flex';
  }
}

window.activarCodigo=async()=>{
  const code=document.getElementById('code-in').value.trim().toUpperCase();
  if(code.length!==6){showToast('El código debe tener 6 caracteres','#ef4444');return;}
  const snap=await get(ref(db,`codigos/timer/${code}`));
  if(!snap.exists()){showToast('Código inválido','#ef4444');return;}
  const d=snap.val();
  if(Date.now()>d.expires){showToast('El código ha expirado','#ef4444');return;}
  if(d.used){showToast('Este código ya fue utilizado','#ef4444');return;}
  await update(ref(db,`codigos/timer/${code}`),{used:true,usedBy:CU.uid,usedByName:CN,usedAt:Date.now()});
  _codeOwnerCache[code]=d.createdByName||'—';
  await update(ref(db,`users/${CU.uid}`),{activeCodeKey:code});
  await log('codigo_usado',`${CN} usó código de cronómetro ${code}`);
  showToast('¡Código válido! Iniciando...','#22c55e');
  await _startFB(code);
};

window.startTimer=async()=>{if(!TS.running&&!TS.limitReached)await _startFB(null);};

async function _startFB(codeKey){
  const pausedElapsed=TS.pausedElapsed||0;
  const startedAt=Date.now()-(pausedElapsed*1000);
  await update(ref(db,`users/${CU.uid}`),{timerRunning:true,timerPaused:false,timerLimitReached:false,timerStartedAt:startedAt,timerPausedElapsed:pausedElapsed,activeCodeKey:codeKey||TS.activeCodeKey||null,online:true,lastSeen:Date.now()});
  await log('timer_iniciado',`${CN} inició su cronómetro`);
}

window.pauseTimer=async(byName)=>{
  if(!TS.running)return;
  const elapsed=calcElapsed(TS);
  await update(ref(db,`users/${CU.uid}`),{timerRunning:false,timerPaused:true,timerStartedAt:0,timerPausedElapsed:elapsed});
  await log('timer_pausado',`Cronómetro de ${CN} pausado${byName?' por '+byName:''} en ${fmt(elapsed)}`);
  if(byName)showToast(`⏸ Tu cronómetro fue pausado por ${byName}`,'#f59e0b');
};

window.resumeTimer=async()=>{
  if(!TS.paused||TS.limitReached)return;
  const pausedElapsed=TS.pausedElapsed||0;
  const startedAt=Date.now()-(pausedElapsed*1000);
  await update(ref(db,`users/${CU.uid}`),{timerRunning:true,timerPaused:false,timerStartedAt:startedAt,timerPausedElapsed:pausedElapsed});
  await log('timer_reanudado',`${CN} reanudó su cronómetro`);
};

window.stopTimer=async(byName)=>{await _stopFB(byName);};

async function _stopFB(byName,forceElapsed){
  const elapsed=forceElapsed!==undefined?forceElapsed:calcElapsed(TS);
  await update(ref(db,`users/${CU.uid}`),{timerRunning:false,timerPaused:false,timerLimitReached:false,timerStartedAt:0,timerPausedElapsed:0,activeCodeKey:null});
  clearInterval(displayInterval);
  const d=document.getElementById('timer-disp');const s=document.getElementById('timer-stat');
  const banner=document.getElementById('limit-banner');
  if(d){d.textContent='00:00';d.className='timer-display';}
  if(s)s.textContent=byName?`⏹ Detenido por ${byName}`:'Sesión guardada ✓';
  if(banner)banner.style.display='none';
  if(elapsed>0){
    const today=new Date().toLocaleDateString('es-MX');
    await push(ref(db,`sesiones/${CU.uid}`),{uid:CU.uid,name:CN,duration:elapsed,timestamp:Date.now(),date:today,stoppedBy:byName||null});
    const ts=await get(ref(db,`users/${CU.uid}/totalSeconds`));
    await set(ref(db,`users/${CU.uid}/totalSeconds`),(ts.val()||0)+elapsed);
    const desc=byName?`Sesión de ${fmt(elapsed)} de ${CN} detenida por ${byName}`:`${CN} completó sesión de ${fmt(elapsed)}`;
    await push(ref(db,'historial'),{tipo:'sesion',uid:CU.uid,name:CN,duration:elapsed,timestamp:Date.now(),stoppedBy:byName||null,desc});
    if(byName)showToast(`⏹ Tu cronómetro fue detenido por ${byName}`,'#ef4444');
  }
}

// Liberar cronómetro al llegar al límite — guarda exactamente 60 min
async function _liberarFB(uid,userName,byName){
  const elapsed=3600;
  await update(ref(db,`users/${uid}`),{timerRunning:false,timerPaused:false,timerLimitReached:false,timerStartedAt:0,timerPausedElapsed:0,activeCodeKey:null});
  const today=new Date().toLocaleDateString('es-MX');
  await push(ref(db,`sesiones/${uid}`),{uid,name:userName,duration:elapsed,timestamp:Date.now(),date:today,stoppedBy:byName,releasedBy:byName});
  const ts=await get(ref(db,`users/${uid}/totalSeconds`));
  await set(ref(db,`users/${uid}/totalSeconds`),(ts.val()||0)+elapsed);
  // Registro completo de liberación
  await push(ref(db,'historial'),{tipo:'liberar_timer',uid,name:userName,duration:elapsed,timestamp:Date.now(),
    desc:`${byName} liberó el cronómetro de ${userName} — sesión de 01:00:00 guardada`});
  await set(ref(db,`timerCommands/${uid}`),{action:'released',by:byName,ts:Date.now()});
}

function buildControl(role){
  const el=document.getElementById('panel-control');if(!el)return;
  el.innerHTML=`
    <div class="section-title">Control de Cronómetros</div>
    <div class="card">
      <div class="card-title" style="display:flex;justify-content:space-between;align-items:center">
        <span>Todos los empleados</span>
        <span style="font-size:11px;color:var(--text3);font-family:var(--mono)">Actualiza cada 5 seg · <span id="ctrl-count" style="color:var(--accent)">0</span> activos</span>
      </div>
      <div id="ctrl-lista" class="scroll-area"><div class="empty">Cargando...</div></div>
    </div>
  `;
  let latestUsers={};
  function renderControl(){
    const el2=document.getElementById('ctrl-lista');if(!el2)return;
    // Mostrar todos excepto admins y el propio usuario
    let entries=Object.entries(latestUsers).filter(([uid,u])=>uid!==CU.uid&&u.role!=='admin');
    const cntEl=document.getElementById('ctrl-count');
    if(cntEl)cntEl.textContent=entries.filter(([,u])=>u.timerRunning||u.timerPaused||u.timerLimitReached).length;
    if(!entries.length){el2.innerHTML='<div class="empty">Sin empleados para controlar</div>';return;}
    const ro={federal:0,alto:1,medio:2,inicial:3};
    entries.sort((a,b)=>{
      const pa=a[1].timerLimitReached?0:(a[1].timerRunning||a[1].timerPaused)?1:2;
      const pb=b[1].timerLimitReached?0:(b[1].timerRunning||b[1].timerPaused)?1:2;
      if(pa!==pb)return pa-pb;
      return (ro[a[1].role]||9)-(ro[b[1].role]||9);
    });
    el2.innerHTML=`<table class="table">
      <thead><tr><th>Empleado</th><th>Rol</th><th>Código de</th><th>Estado</th><th>Tiempo actual</th><th>Acciones</th></tr></thead>
      <tbody>${entries.map(([uid,u])=>{
        const ts={running:u.timerRunning,paused:u.timerPaused,startedAt:u.timerStartedAt||0,pausedElapsed:u.timerPausedElapsed||0};
        const elapsed=calcElapsed(ts);
        const lim=u.timerLimitReached||false;
        const owner=u.activeCodeKey?(_codeOwnerCache[u.activeCodeKey]||'—'):'—';
        return`<tr>
          <td>${u.name}</td>
          <td><span class="role-badge role-${u.role}">${u.role}</span></td>
          <td style="font-size:12px;color:var(--accent)">${owner}</td>
          <td>${lim?'<span style="color:var(--red)">⏰ Límite 1h</span>':u.timerRunning?'<span class="online-dot"></span>Corriendo':u.timerPaused?'<span style="color:var(--yellow)">⏸ Pausado</span>':'—'}</td>
          <td id="ctrl-time-${uid}" style="font-family:var(--mono)">${lim?'<span style="color:var(--red)">01:00:00</span>':(u.timerRunning||u.timerPaused)?fmt(elapsed):'—'}</td>
          <td><div style="display:flex;gap:6px;flex-wrap:wrap">
            ${lim?`<button class="btn btn-green btn-xs" onclick="liberarTimer('${uid}','${u.name}')">✅ Liberar</button>`:''}
            ${!lim&&u.timerRunning?`<button class="btn btn-yellow btn-xs" onclick="remoteCmd('${uid}','${u.name}','pause')">⏸ Pausar</button>`:''}
            ${!lim&&(u.timerRunning||u.timerPaused)?`<button class="btn btn-red btn-xs" onclick="remoteCmd('${uid}','${u.name}','stop')">⏹ Detener</button>`:''}
            ${!lim&&!u.timerRunning&&!u.timerPaused?'<span style="color:var(--text3);font-size:12px">Sin cronómetro</span>':''}
          </div></td>
        </tr>`;
      }).join('')}</tbody>
    </table>`;
  }
  onValue(ref(db,'users'),snap=>{latestUsers=snap.val()||{};renderControl();});
  clearInterval(controlRefreshInterval);
  controlRefreshInterval=setInterval(async()=>{
    for(const [uid,u] of Object.entries(latestUsers)){
      const cell=document.getElementById(`ctrl-time-${uid}`);if(!cell)continue;
      if(u.timerLimitReached){cell.innerHTML='<span style="color:var(--red)">⏰ 01:00:00</span>';continue;}
      if(u.timerRunning||u.timerPaused){
        const ts={running:u.timerRunning,paused:u.timerPaused,startedAt:u.timerStartedAt||0,pausedElapsed:u.timerPausedElapsed||0};
        const elapsed=calcElapsed(ts);
        // Detectar límite de 60 min para inicial/medio aunque estén offline
        if(ROLES_LIMITADOS.has(u.role)&&elapsed>=3600&&!u.timerLimitReached){
          await update(ref(db,`users/${uid}`),{timerRunning:false,timerLimitReached:true,timerStartedAt:0,timerPausedElapsed:3600});
          cell.innerHTML='<span style="color:var(--red)">⏰ 01:00:00</span>';
          showToast(`${u.name} alcanzó el límite de 1 hora`,'#f59e0b');
          renderControl();
        } else {
          cell.textContent=fmt(elapsed);
        }
      }
    }
  },5000);
}

window.liberarTimer=async(uid,name)=>{
  if(!confirm(`¿Liberar el cronómetro de ${name}? Se guardará la sesión de 60 minutos.`))return;
  await _liberarFB(uid,name,CN);
  showToast(`Cronómetro de ${name} liberado ✓`,'#22c55e');
};

window.remoteCmd=async(uid,name,action)=>{
  const uSnap=await get(ref(db,`users/${uid}`));
  const ud=uSnap.val();if(!ud)return;
  const ts={running:ud.timerRunning,paused:ud.timerPaused,startedAt:ud.timerStartedAt||0,pausedElapsed:ud.timerPausedElapsed||0};
  const elapsed=calcElapsed(ts);
  const esLimitado=ROLES_LIMITADOS.has(ud.role);
  const superaLimite=elapsed>=3600;

  if(action==='pause'){
    if(!ud.timerRunning)return;
    const elapsedPausa=esLimitado?Math.min(elapsed,3600):elapsed;
    await update(ref(db,`users/${uid}`),{timerRunning:false,timerPaused:true,timerStartedAt:0,timerPausedElapsed:elapsedPausa});
    await set(ref(db,`timerCommands/${uid}`),{action:'pause',by:CN,byUid:CU.uid,ts:Date.now()});
    await log('control_timer',`${CN} pausó el cronómetro de ${name} en ${fmt(elapsedPausa)}`);
    showToast(`${name} pausado ✓`,'#f59e0b');
  } else if(action==='stop'){
    if(esLimitado&&superaLimite){
      // Si es inicial/medio y supera 60 min → liberar con exactamente 60 min
      await _liberarFB(uid,name,CN);
      showToast(`${name}: 60 min guardados (límite). Liberado ✓`,'#22c55e');
    } else {
      // Detener normal — guardar tiempo real (sin cap para altos/federales)
      const duracion=esLimitado?Math.min(elapsed,3600):elapsed;
      await update(ref(db,`users/${uid}`),{timerRunning:false,timerPaused:false,timerLimitReached:false,timerStartedAt:0,timerPausedElapsed:0,activeCodeKey:null});
      if(duracion>0){
        const today=new Date().toLocaleDateString('es-MX');
        await push(ref(db,`sesiones/${uid}`),{uid,name,duration:duracion,timestamp:Date.now(),date:today,stoppedBy:CN});
        const tSnap=await get(ref(db,`users/${uid}/totalSeconds`));
        await set(ref(db,`users/${uid}/totalSeconds`),(tSnap.val()||0)+duracion);
        await push(ref(db,'historial'),{tipo:'sesion',uid,name,duration:duracion,timestamp:Date.now(),stoppedBy:CN,
          desc:`Sesión de ${fmt(duracion)} de ${name} detenida por ${CN}`});
      }
      await set(ref(db,`timerCommands/${uid}`),{action:'stop',by:CN,byUid:CU.uid,ts:Date.now()});
      await log('control_timer',`${CN} detuvo el cronómetro de ${name} (${fmt(duracion)})`);
      showToast(`${name} detenido ✓`,'#22c55e');
    }
  }
};

  onValue(ref(db,'codigos/timer'),snap=>{

  onValue(ref(db,'users'),snap=>{latestUsers=snap.val()||{};renderAlto();});

  setInterval(()=>{
    Object.entries(latestUsers).forEach(([uid,u])=>{
      const cell=document.getElementById(`ctrl-alto-time-${uid}`);if(!cell)return;
      if(u.timerLimitReached){cell.innerHTML='<span style="color:var(--red)">01:00:00</span>';return;}

// ═══════════════════════════════════════════════════════════
// RENDIMIENTO DE CARGOS ALTOS (ADMIN ONLY)
// ═══════════════════════════════════════════════════════════
function buildRendimientoAltos(){
  const el=document.getElementById('panel-rendimiento');if(!el)return;
  el.innerHTML=`
    <div class="section-title">📈 Rendimiento de Cargos Altos</div>
    <p style="font-size:13px;color:var(--text2);margin-bottom:20px">Ranking de cargos altos basado en códigos generados, tiempo producido y sesiones de 1 hora completadas.</p>
    <div id="tabla-rendimiento" class="card"><div class="empty">Cargando...</div></div>
  `;
  // Cargar datos necesarios en paralelo
  Promise.all([
    get(ref(db,'users')),
    get(ref(db,'codigos/timer')),
    get(ref(db,'historial'))
  ]).then(([usersSnap,codesSnap,histSnap])=>{
    const el2=document.getElementById('tabla-rendimiento');if(!el2)return;
    const users=usersSnap.val()||{};
    const codes=codesSnap.exists()?Object.values(codesSnap.val()):[];
    const hist=histSnap.exists()?Object.values(histSnap.val()):[];

    // Obtener todos los cargos altos
    const altos=Object.entries(users).filter(([,u])=>u.role==='alto');
    if(!altos.length){el2.innerHTML='<div class="empty">Sin cargos altos registrados</div>';return;}

    // Calcular métricas por alto
    const metricas=altos.map(([uid,u])=>{
      // Códigos generados por este alto
      const misCodigosKeys=codes.filter(c=>c.createdBy===uid).map(c=>c.code);
      const codigosGenerados=misCodigosKeys.length;
      const codigosUsados=codes.filter(c=>c.createdBy===uid&&c.used).length;
      // Sesiones de empleados que usaron sus códigos
      const sesionesDeEmpleados=hist.filter(h=>h.tipo==='sesion'&&h.stoppedBy!==u.name)
        .filter(()=>true); // aproximación — se filtra por historial de liberaciones
      // Liberaciones de 1 hora que hizo este alto
      const liberaciones=hist.filter(h=>h.tipo==='liberar_timer'&&h.name===u.name).length;
      // Tiempo total generado (sesiones de empleados con sus códigos)
      // Usar sesiones vinculadas vía historial de control_timer
      const tiempoGenerado=hist.filter(h=>h.tipo==='sesion'&&misCodigosKeys.length>0).reduce((acc)=>acc,0);
      // Sesiones detenidas por este alto
      const sesionesDetenidas=hist.filter(h=>h.tipo==='sesion'&&h.stoppedBy===u.name);
      const tiempoGestionado=sesionesDetenidas.reduce((acc,h)=>acc+(h.duration||0),0);

      return{
        uid,name:u.name,online:u.online,
        codigosGenerados,codigosUsados,
        liberaciones,
        tiempoGestionado,
        score: (codigosUsados*2)+(liberaciones*5)+(Math.floor(tiempoGestionado/60))
      };
    }).sort((a,b)=>b.score-a.score);

    el2.innerHTML=`<table class="table">
      <thead><tr><th>#</th><th>Cargo Alto</th><th>Estado</th><th>Códigos generados</th><th>Códigos usados</th><th>Horas liberadas</th><th>Tiempo gestionado</th><th>Score</th></tr></thead>
      <tbody>${metricas.map((m,i)=>`<tr>
        <td style="font-family:var(--mono);color:var(--text3)">${i+1}</td>
        <td><strong>${m.name}</strong></td>
        <td>${m.online?'<span class="online-dot"></span>En línea':'<span class="offline-dot"></span>Off'}</td>
        <td style="font-family:var(--mono);color:var(--accent)">${m.codigosGenerados}</td>
        <td style="font-family:var(--mono);color:var(--green)">${m.codigosUsados}</td>
        <td style="font-family:var(--mono);color:var(--yellow)">${m.liberaciones}</td>
        <td style="font-family:var(--mono)">${fmtH(m.tiempoGestionado)}</td>
        <td><span style="font-family:var(--mono);font-size:16px;color:${i===0?'var(--yellow)':i===1?'var(--text)':'var(--text3)'}">${m.score} pts</span></td>
      </tr>`).join('')}</tbody>
    </table>
    <div style="text-align:right;margin-top:12px"><button class="btn btn-secondary btn-sm" onclick="buildRendimientoAltos()">↺ Actualizar</button></div>`;
  });
}

window.genCodigo=async tipo=>{
  const [miSnap,cfgSnap]=await Promise.all([
    get(ref(db,`users/${CU.uid}/codigosDeshabilitados`)),
    get(ref(db,'config/codigosGlobalHabilitado'))
  ]);
  if(miSnap.exists()&&miSnap.val()===true){showToast('Tienes la generación de códigos inhabilitada. Contacta a un admin.','#ef4444');return;}
  if(cfgSnap.exists()&&cfgSnap.val()===false){showToast('La generación de códigos está inhabilitada globalmente en este momento.','#ef4444');return;}
  const code=rndCode(),exp=Date.now()+300000;
  await set(ref(db,`codigos/${tipo}/${code}`),{code,tipo,expires:exp,used:false,createdBy:CU.uid,createdByName:CN,createdAt:Date.now()});
  _codeOwnerCache[code]=CN;
  await log('codigo_generado',`${CN} generó código de ${tipo}: ${code}`);
  const dispId=tipo==='timer'?'timer-code-disp':'alert-code-disp';
  const cdId  =tipo==='timer'?'timer-code-cd':'alert-code-cd';
  document.getElementById(dispId).innerHTML=`<div class="gen-code${tipo==='alerta'?' alert-code':''}">${code}</div>`;
  const exp2=exp;
  const iv=setInterval(()=>{
    const left=Math.max(0,Math.floor((exp2-Date.now())/1000));
    const e=document.getElementById(cdId);
    if(e)e.innerHTML=left>0?`Expira en: <span>${fmt(left)}</span>`:'<span style="color:var(--red)">Expirado</span>';
    if(left<=0)clearInterval(iv);
  },1000);
  if(tipo==='timer'){clearInterval(codeExpTimer);codeExpTimer=iv;}
  else{clearInterval(alertCodeExpTimer);alertCodeExpTimer=iv;}
};
function listenCodigos(role){
  const render=()=>{
    Promise.all([get(ref(db,'codigos/timer')),get(ref(db,'codigos/alerta'))]).then(([ts,as])=>{
      const el=document.getElementById('hist-codigos');if(!el)return;
      let items=[];
      if(ts.exists())Object.values(ts.val()).forEach(c=>{_codeOwnerCache[c.code]=c.createdByName;items.push({...c,tipo:'timer'});});
      if(as.exists())Object.values(as.val()).forEach(c=>items.push({...c,tipo:'alerta'}));
      if(!ROLES_CONTROL.has(role))items=items.filter(c=>c.createdBy===CU.uid);
      items.sort((a,b)=>b.createdAt-a.createdAt);
      if(!items.length){el.innerHTML='<div class="empty">Sin códigos</div>';return;}
      el.innerHTML=`<table class="table">
        <thead><tr><th>Código</th><th>Tipo</th>${ROLES_CONTROL.has(role)?'<th>Por</th>':''}<th>Hora</th><th>Estado</th><th>Usado por</th></tr></thead>

          <td style="font-family:var(--mono);letter-spacing:2px">${c.code}</td>
          <td>${c.tipo==='timer'?'<span class="tag tag-green">⏱ Cronómetro</span>':'<span class="tag tag-purple">🔐 Alerta</span>'}</td>
          ${ROLES_CONTROL.has(role)?`<td>${c.createdByName||'-'}</td>`:''}
          <td>${tsStr(c.createdAt)}</td>
          <td>${Date.now()>c.expires?'<span class="tag tag-red">Expirado</span>':c.used?'<span class="tag tag-yellow">Usado</span>':'<span class="tag tag-green">Disponible</span>'}</td>
          <td>${c.usedByName||'—'}</td>
        </tr>`).join('')}</tbody>
      </table>`;
    });
  };
  onValue(ref(db,'codigos/timer'),render);
  onValue(ref(db,'codigos/alerta'),render);
}

window.enviarAlertaAlto=async()=>{
  const dest=document.getElementById('aa-dest').value;
  const tipo=document.getElementById('aa-tipo').value;
  const texto=document.getElementById('aa-texto').value.trim();
  if(!texto){showToast('Escribe una descripción','#ef4444');return;}
  let min=0;
  if(tipo==='penalizacion'){
    const codigo=document.getElementById('aa-codigo').value.trim().toUpperCase();
    min=parseInt(document.getElementById('aa-min').value)||0;
    if(codigo.length!==6){showToast('Ingresa el código de alerta','#ef4444');return;}
    const cs=await get(ref(db,`codigos/alerta/${codigo}`));
    if(!cs.exists()){showToast('Código inválido','#ef4444');return;}
    const cd=cs.val();
    if(Date.now()>cd.expires){showToast('Código expirado','#ef4444');return;}
    if(cd.used){showToast('Código ya utilizado','#ef4444');return;}
    const creator=await get(ref(db,`users/${cd.createdBy}`));
    if(!creator.exists()||!['admin','federal'].includes(creator.val().role)){showToast('El código debe ser de un admin o federal','#ef4444');return;}
    await update(ref(db,`codigos/alerta/${codigo}`),{used:true,usedBy:CU.uid,usedByName:CN,usedAt:Date.now()});
    if(min>0)await restarMin(dest,min);
  }
  await push(ref(db,`alertas/${dest}`),{tipo,texto,minutos:min,fromName:CN,fromUid:CU.uid,timestamp:Date.now(),confirmado:false});
  await log('alerta',`${CN} envió alerta ${tipo} a ${allUsers[dest]?.name||dest}${min?` (-${min} min)`:''}`);
  showToast('Alerta enviada ✓','#f59e0b');
  document.getElementById('aa-texto').value='';
  if(tipo==='penalizacion')document.getElementById('aa-codigo').value='';
};

  await push(ref(db,`alertas/${dest}`),{tipo,texto,minutos:min,fromName:CN,fromUid:CU.uid,timestamp:Date.now(),confirmado:false});
  if(tipo==='penalizacion'&&min>0)await restarMin(dest,min);
  await log('alerta',`${CN} envió alerta ${tipo} a ${allUsers[dest]?.name||dest}${min?` (-${min} min)`:''}`);
  showToast('Alerta enviada ✓','#f59e0b');
  document.getElementById('adm-texto').value='';
};

window.resetTiempo=async(uid,name,prevSeconds)=>{
  if(!confirm(`¿Resetear el tiempo total de ${name}? No se puede deshacer.`))return;
  await set(ref(db,`users/${uid}/totalSeconds`),0);
  // Registro completo del reseteo
  await push(ref(db,'historial'),{
    tipo:'reset_tiempo',
    desc:`${CN} reseteó el tiempo total de ${name} (tenía ${fmtH(prevSeconds||0)})`,
    uid:CU.uid,name:CN,targetUid:uid,targetName:name,prevSeconds:prevSeconds||0,timestamp:Date.now()
  });
  showToast(`Tiempo de ${name} reseteado ✓`,'#22c55e');
};
window.pedirRestar=async(uid,name)=>{
  const mins=prompt(`¿Cuántos minutos restar a ${name}?`);
  if(!mins||isNaN(mins)||parseInt(mins)<=0){showToast('Ingresa un número válido','#ef4444');return;}
  const m=parseInt(mins);
  const snap=await get(ref(db,`users/${uid}/totalSeconds`));
  const prev=snap.val()||0;
  await restarMin(uid,m);
  // Registro completo
  await push(ref(db,'historial'),{
    tipo:'restar_minutos',
    desc:`${CN} restó ${m} min a ${name} (tenía ${fmtH(prev)}, quedó ${fmtH(Math.max(0,prev-(m*60)))})`,
    uid:CU.uid,name:CN,targetUid:uid,targetName:name,minutosRestados:m,timestamp:Date.now()
  });
  showToast(`-${m} min restados a ${name} ✓`,'#f59e0b');
};
async function restarMin(uid,mins){
  const snap=await get(ref(db,`users/${uid}/totalSeconds`));
  await set(ref(db,`users/${uid}/totalSeconds`),Math.max(0,(snap.val()||0)-(mins*60)));
}

    <div class="card">
      <div class="form-row"><label>Destinatario</label><select id="com-dest"></select></div>
      <div class="form-row"><label>Destinatarios (envío grupal por cargo)</label>
        <select id="com-dest-rol">
          <option value="">— Ninguno, usar el destinatario individual de arriba —</option>
          <option value="rol:inicial">👥 Todos los Cargos Iniciales</option>
          <option value="rol:medio">👥 Todos los Cargos Medios</option>
          <option value="rol:alto">👥 Todos los Cargos Altos</option>
          <option value="rol:federal">👥 Todos los Cargos Federales</option>
        </select>
      </div>
      <div class="form-row"><label>Mensaje</label><textarea id="com-texto" placeholder="Escribe el comunicado..." style="min-height:120px"></textarea></div>
      <button class="btn btn-primary w-full" onclick="enviarCom()">Enviar comunicado</button>
    </div>
    <div class="card">
      <div class="card-title">Comunicados enviados</div>
      <div class="cleanup-bar" style="margin-bottom:12px">
        <span class="cleanup-info">Se conservan indefinidamente.</span>
        <button class="btn btn-secondary btn-xs" onclick="limpiarComunicados()">🗑 Limpiar +7 días</button>
      </div>
      <div id="lista-com-adm" class="scroll-area"><div class="empty">Sin comunicados</div></div>
    </div>
  `;
  onValue(ref(db,'users'),snap=>{
    const sel=document.getElementById('com-dest');if(!sel)return;
    sel.innerHTML='<option value="todos">📢 Todos los empleados</option>'+Object.entries(snap.val()||{}).map(([uid,u])=>`<option value="${uid}">${u.name} (${u.role})</option>`).join('');
  });
  onValue(ref(db,'comunicados'),snap=>{
    const el2=document.getElementById('lista-com-adm');if(!el2)return;
    const data=snap.val();
    if(!data){el2.innerHTML='<div class="empty">Sin comunicados</div>';return;}
    const items=Object.entries(data).map(([k,v])=>({id:k,...v})).sort((a,b)=>b.timestamp-a.timestamp);
    el2.innerHTML=items.map(c=>`<div class="comunicado-item">
      ${CR==='admin'?`<button class="del-btn" onclick="delCom('${c.id}')">✕</button>`:''}
      <div class="comunicado-meta">Para: <strong>${c.dest==='todos'?'📢 Todos':c.dest?.startsWith('rol:')?'👥 '+(ROLE_LABELS[c.dest.split(':')[1]]||c.dest):(allUsers[c.dest]?.name||c.dest)}</strong> · ${tsStr(c.timestamp)}</div>
      <div class="comunicado-text">${c.texto}</div>
    </div>`).join('');
  });
}
window.enviarCom=async()=>{
  const destRol=document.getElementById('com-dest-rol').value;
  const destInd=document.getElementById('com-dest').value;
  const dest=destRol||destInd;
  const texto=document.getElementById('com-texto').value.trim();
  if(!texto){showToast('Escribe un mensaje','#ef4444');return;}
  await push(ref(db,'comunicados'),{dest,texto,fromName:CN,timestamp:Date.now()});
  await log('comunicado',`${CN} envió comunicado a ${dest}`);
  showToast('Comunicado enviado ✓','#22c55e');
  document.getElementById('com-texto').value='';
  document.getElementById('com-dest-rol').value='';
};

// ── CÓDIGO DE PROPIETARIOS ─────────────────────────────────
function initCodeOwnerCache(){
  onValue(ref(db,'codigos/timer'),snap=>{
    if(!snap.exists())return;
    Object.values(snap.val()).forEach(c=>{if(c.code&&c.createdByName)_codeOwnerCache[c.code]=c.createdByName;});
  });
}

// ── TEMA CLARO/OSCURO ─────────────────────────────────────
window.toggleTheme=()=>{
  const root=document.documentElement;
  const isLight=root.getAttribute('data-theme')==='light';
  if(isLight){
    root.removeAttribute('data-theme');
    document.getElementById('theme-btn').textContent='🌙';
    localStorage.setItem('cf-theme','dark');
  } else {
    root.setAttribute('data-theme','light');
    document.getElementById('theme-btn').textContent='☀️';
    localStorage.setItem('cf-theme','light');
  }
};
// Restaurar tema guardado
(()=>{
  const saved=localStorage.getItem('cf-theme');
  if(saved==='light'){
    document.documentElement.setAttribute('data-theme','light');
    const btn=document.getElementById('theme-btn');
    if(btn)btn.textContent='☀️';
  }
})();

// ── LOG ────────────────────────────────────────────────────
async function log(tipo,desc){
  if(!CU)return;
  await push(ref(db,'historial'),{tipo,desc,uid:CU.uid,name:CN,timestamp:Date.now()});
}

document.getElementById('login-pass').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
document.getElementById('login-email').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
</script>
